<!-- RESTATES: spn-foundation docs/04-capabilities/01-devex/04-workspace/04-docs/05-pages.md § The surface preview
     and docs/04-capabilities/01-devex/04-workspace/02-workstream/01-workstream.md § An arc carries its specification, or names the note that holds it
     This file holds the structure of a surface page and states no rule: the bar with the page's title, the Case switch as labelled
     tabs where the page is a whole screen with cases (a layout or a page kind, the default case first), and the Width, Mode and
     Notes switches as icon buttons, each named by its aria-label and title, the frame, the badges layer above it, the notes panel
     beside it, the page's own markup in one template for each case, device and mode that was rendered (`page-LIGHT-DESKTOP`,
     `page-DARK-PHONE` and so on for the default case, `page-<CASE>-LIGHT-DESKTOP` for each other case, opened by `#case-<case>` in
     lower case with hyphens), the notes in JSON outside the page, the two metas that name
     the design system's version and the app's stylesheet, and the two lines that load the shared stylesheet and script. The script
     builds the frame's document from the template the switches pick: it links design-system.css from the folder it was served from,
     the cut of the design system the first meta names, and the app's stylesheet at the path the second names, sets data-mode from
     the Light and Dark switch, sizes the frame by the width switch, and swaps in the case the Case switch picks. Where no markup was rendered for a device and mode it uses
     the nearest one and restyles only. The frame holds the markup `spnutils apps surface render` prints, or a copy of a running
     page's body, and nothing else: no wrapper, no aside, no attribute added. A `#<id>` in the page's address scrolls the frame to
     that element. -->
<!-- Placeholders:
     {{DS-VERSION}} the design system version the markup was drawn with, the `ds` the render prints, such as 11.21.0
     {{APP-CSS}} the app's stylesheet, a relative path, or empty for Surface's own look with no brand
     {{NAME}} the page's short name, at most three words (RULE.DEVEX.WORKSPACE.517): the block's title, written in the `<title>`, the outline's title, the eyebrow's last segment, the breadcrumb of a page below it and the page's entry in an index
     {{CASES}} the Case switch: one `<button role="tab" data-surface="case" data-value="<CASE>">` for each case of the screen, its words as its label, the default first; leave the whole group out on a page with no cases, such as a family page of containers or widgets, which draws every kind and every case at once
     {{MARKUP}} the page's markup: replace the sample page between a template's tags with what `spnutils apps surface render` prints for that case, device and mode, untouched. Write one `<template id="page-<MODE>-<DEVICE>">` for each device (DESKTOP, TABLET, PHONE) and mode (LIGHT, DARK) that was rendered, one `<template id="page-<CASE>-<MODE>-<DEVICE>">` for each other case, and no more
     {{NOTES}} the JSON in `<script type="application/json" id="sample-notes">`: a list on a page with no cases, or an object holding a list for each case code on a page with cases; one `{ "n", "kind", "case", "text" }` for each top-level section, `n` its place among the page's top-level sections counted from 0, `kind` the kind's name and `case` its case in words where that matters (the note's short title), `text` one plain sentence (why the section is there, or "Planned: needs <unit>"). A note is its number, a short title and that sentence: no status, no link -->

    </div>
  </header>
  <div class="sds-surface-body">
    <main class="sds-surface-stage">
      <iframe class="sds-surface-frame" title="{{NAME}}"></iframe>
      <div class="sds-surface-notes" hidden></div>
    </main>
    <aside class="sds-surface-panel" aria-label="Notes" hidden></aside>
  </div>
</div>
