<!-- RESTATES: spn-foundation docs/04-capabilities/01-devex/04-workspace/04-docs/05-artifacts.md § The surface preview
     and docs/04-capabilities/01-devex/04-workspace/02-workstream/01-workstream.md § An arc carries its specification, or names the note that holds it
     This file holds the structure of a surface page and states no rule: the bar with the page's title and its three switches,
     the frame, the page's own markup in the template named `page`, the two metas that name the design system's version and the
     app's stylesheet, and the two lines that load the shared stylesheet and script. The script builds the frame's document from
     the template: it links design-system.css from the folder it was served from, the cut of the design system the first meta names, and the app's stylesheet at the path the
     second names, sets data-mode from the Light and Dark switch, and sizes the frame by the width switch. The markup is what
     `spnutils apps surface render` prints, or a copy of a running page's body. -->
<!-- Placeholders:
     {{DS-VERSION}} the design system version the markup was drawn with, the `ds` the render prints, such as 11.21.0
     {{APP-CSS}} the app's stylesheet, a relative path, or empty for Surface's own look with no brand
     {{NAME}} the page's short name, at most three words (RULE.DEVEX.WORKSPACE.517): the block's title, written in the `<title>`, the outline's title, the eyebrow's last segment, the breadcrumb of a page below it and the page's entry in an index
     {{MARKUP}} the page's markup: replace the sample page between the template's tags with what `spnutils apps surface render` prints, one wrapper for each section holding that section's note (`data-note`, one plain sentence: the section pattern and the question it answers) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="surface-ds" content="11.21.0">
<meta name="surface-app-css" content="">
<title>{{NAME}}</title>
<!-- spn:doc
{"id": "surface-page-{{page}}", "variant": "surface-page", "title": "{{NAME}}"}
-->
<link rel="stylesheet" href="https://saasplane.github.io/spn-claude-marketplace/assets/docs/1.16.0/docs-language.css" integrity="sha384-H4EyRs541ZXMRQxsxagmy9Ir0am/DHEi/ot+dmQMJq+nN0IKEXJsWuQgsGoL3ket" crossorigin="anonymous">
<div class="sds-surface" data-width="desktop">
  <header class="sds-surface-bar">
    <h1 class="sds-surface-title">{{NAME}}</h1>
    <div class="sds-surface-switch" role="group" aria-label="Width">
      <button type="button" data-surface="width" data-value="desktop">Desktop</button>
      <button type="button" data-surface="width" data-value="tablet">Tablet</button>
      <button type="button" data-surface="width" data-value="phone">Phone</button>
    </div>
    <div class="sds-surface-switch" role="group" aria-label="Mode">
      <button type="button" data-surface="mode" data-value="light">Light</button>
      <button type="button" data-surface="mode" data-value="dark">Dark</button>
    </div>
    <div class="sds-surface-switch" role="group" aria-label="Notes">
      <button type="button" data-surface="notes">Notes</button>
    </div>
  </header>
  <main class="sds-surface-stage">
    <iframe class="sds-surface-frame" title="{{NAME}}"></iframe>
  </main>
</div>
