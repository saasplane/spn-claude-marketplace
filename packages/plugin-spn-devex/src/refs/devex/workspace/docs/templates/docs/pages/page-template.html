<!-- RESTATES: spn-foundation docs/04-capabilities/01-devex/04-workspace/04-docs/05-artifacts.md § The masthead, and the opening · § The page itself — its outline, its rail, its width and its furniture · § One stylesheet, served in versions
     This file holds the structure of a page with no rail of its own and states no rule: the two lines that load the shared stylesheet and script,
     the frame, a breadcrumb back to where the reader came from, the masthead, and the sections. Every other page template shares this
     frame. The script adds an "On this page" outline on the right when the page holds three or more sections whose heads hold an h2,
     and nothing when it holds fewer. -->
<!-- Placeholders:
     {{ID}} the page's id, written once in the block: the repository, the kind and the subject, in lower case with hyphens
     {{NAME}} the page's short name, at most three words (RULE.DEVEX.WORKSPACE.517): the block's title, written in the `<title>`, the outline's title, the eyebrow's last segment, the breadcrumb of a page below it and the page's entry in an index
     {{TITLE}} the page's heading, the promise the page makes: the `<h1>` only
     {{SUBTITLE}} one sentence: what the reader gets from the page
     {{UP-HREF}} the address of the page the reader came from, ending in .html; the eyebrow's second level links it
     {{WORKSPACE}} the organization
     {{REPOSITORY}} the repository or the workstream the page belongs to
     {{KIND}} what the page is, in two or three words
     {{BADGE}} the page's type, one of Diff, Trial, List or Note
     {{SECTION}} the heading of a section, one or two words
     {{SECTION-TEXT}} what the section says -->
<meta charset="utf-8">
<title>{{NAME}}</title>
<!-- spn:doc
{"id": "{{ID}}", "variant": "page", "title": "{{NAME}}"}
-->
<link rel="stylesheet" href="https://saasplane.github.io/spn-claude-marketplace/assets/docs/1.16.0/docs-language.css" integrity="sha384-eVD+IKBOvQdjamPNYDYt/cSGd89JPQBFPUGneKDviQlHjWc8KB4hxNVbNQ1wRBQd" crossorigin="anonymous">
<div class="sds-page" data-frame="page"><div class="sds-wrap">

<header class="sds-masthead">
  <div class="sds-eyebrow"><span class="sds-line1">{{WORKSPACE}} &middot; <a href="{{UP-HREF}}">{{REPOSITORY}}</a> &middot; {{NAME}}</span><span class="sds-line"><span class="sds-label">Type:</span> <span class="sds-badge sds-type">{{BADGE}}</span></span></div>
  <h1>{{TITLE}}</h1>
  <p class="sds-subtitle">{{SUBTITLE}}</p>
</header>

<section id="s1">
  <div class="sds-section-head"><h2>{{SECTION}}</h2></div>
  <p>{{SECTION-TEXT}}</p>
</section>

<section id="s2">
  <div class="sds-section-head"><h2>{{SECTION}}</h2></div>
  <p>{{SECTION-TEXT}}</p>
</section>

</div></div>
<script src="https://saasplane.github.io/spn-claude-marketplace/assets/docs/1.16.0/docs-page.js" integrity="sha384-bUcUMs5a2AK/ri9Agb1d0fRAtNioxNc3QQSa5mPRoAWYCXd1sU+K/dWEoIH9LvNa" crossorigin="anonymous"></script>
