<!-- RESTATES: spn-foundation docs/04-capabilities/01-devex/04-workspace/04-docs/05-artifacts.md § The surface page preview
     and docs/04-capabilities/01-devex/04-workspace/02-workstream/01-workstream.md § An arc carries its specification, or names the note that holds it
     This file holds the structure of a surface page preview and states no rule: the bar with the page's title and its three switches,
     the frame over the page's own copy, and the two lines that load the shared stylesheet and script. The copy sits beside it in
     `.pages/<page>/` and is the work's own file. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface Page Preview Template</title>
<!-- spn:doc
{"id": "surface-page-preview-{{page}}", "variant": "surface-page-preview", "title": "{{THE PAGE'S NAME}}"}
-->
<link rel="stylesheet" href="https://saasplane.github.io/spn-claude-marketplace/assets/docs/1.15.0/sds-docs.css" integrity="sha384-R47poopLRnz65naDQiMbuRZgxiTZtsgOLsiaP10qjWo62gNyH4ezyJy2v/TyMG5J" crossorigin="anonymous">
<div class="sds-surface" data-width="desktop">
  <header class="sds-surface-bar">
    <h1 class="sds-surface-title">{{THE PAGE'S NAME}}</h1>
    <div class="sds-surface-switch" role="group" aria-label="Width">
      <button type="button" data-surface="width" data-value="desktop">Desktop</button>
      <button type="button" data-surface="width" data-value="tablet">Tablet</button>
      <button type="button" data-surface="width" data-value="phone">Phone</button>
    </div>
    <div class="sds-surface-switch" role="group" aria-label="Mode">
      <button type="button" data-surface="mode" data-value="light">Light</button>
      <button type="button" data-surface="mode" data-value="dark">Dark</button>
    </div>
    <div class="sds-surface-switch" role="group" aria-label="Notes">
      <button type="button" data-surface="notes">Notes</button>
    </div>
  </header>
  <main class="sds-surface-stage">
    <iframe class="sds-surface-frame" src=".pages/{{page}}/index.html" title="{{THE PAGE'S NAME}}"></iframe>
  </main>
</div>
<script src="https://saasplane.github.io/spn-claude-marketplace/assets/docs/1.15.0/sds-docs.js" integrity="sha384-XYna7dQ9hUAzsp8poWNLetdO4Oyfh/cIKwuuh6sduxMcNDmnLGJ3zcw6DaG1IN9+" crossorigin="anonymous"></script>
