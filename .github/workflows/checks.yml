# Written by `spnutils repo agent-sync` 5.41.0 from this repository's sprepo.json (GENERAL).
# Never edit it: a re-run rewrites it.
#
# Each job id is a status check the branch rulesets require, so a job that fails blocks the merge,
# for every caller. Every action is pinned by its commit and every image by its digest; the release
# each one is sits beside it, and the command holds the one table they are chosen from.
#
# The jobs run on a pull request into a permanent branch and on a push to develop. A promotion's pull
# request into qa, uat or main has as its head a commit that already passed them on develop, so a job
# skips there where the head is a permanent branch of this repository, and a skipped job meets its
# check. Any other head runs every job, and promotion-source refuses it.
#
# The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070). Every job is written as it
# runs, and its own `if: false` skips it: a skipped job meets its check, so no runner starts and no
# merge waits. The switch in spnutils turns them back on, and each job then runs as written.
name: checks

on:
  pull_request:
    branches: [develop, qa, uat, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Promotion source: a pull request into qa, uat or main comes from a permanent branch below its base,
  # from the one directly above it for a merge down, or from a hotfix/* branch, each of this repository.
  # Any head into develop passes. The head is read from the event, never from text a contributor types
  # into the script, and a fork's head never passes.
  promotion-source:
    if: false # The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the pull request's source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "develop" ]; then
            echo "A pull request into develop may come from any branch."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::A pull request into $BASE comes from this repository, never from a fork ($HEAD_REPO)."
            exit 1
          fi
          case "$BASE" in
            qa) allowed="develop uat" ;;
            uat) allowed="develop qa main" ;;
            main) allowed="develop qa uat" ;;
            *) allowed="" ;;
          esac
          for branch in $allowed; do
            if [ "$HEAD" = "$branch" ]; then
              echo "$HEAD into $BASE is a promotion or a merge down."
              exit 0
            fi
          done
          case "$HEAD" in
            hotfix/?*)
              echo "$HEAD into $BASE is a fix's own pull request."
              exit 0
              ;;
          esac
          echo "::error::$BASE takes a pull request from $allowed or a hotfix/* branch, never from '$HEAD'. Open it with spnutils repo promote $BASE, or cut a hotfix/<subject> branch from $BASE."
          exit 1

  # The `test` script the root package.json declares.
  test:
    if: false # The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the repository's tests
        run: pnpm test

  # Semgrep CE, its default rules, failing on any finding.
  code-scan:
    if: false # The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the code
        run: semgrep scan --config p/default --error --metrics off

  # OSV-Scanner: every lockfile in the tree, against the OSV database, failing on any advisory.
  dependency-scan:
    if: false # The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the dependencies
        env:
          OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0
        run: docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source --recursive /src

  # TruffleHog: the commits this change adds, failing on a secret that is verified or cannot be ruled out.
  secret-scan:
    if: false # The checks are off until the cloud runs them (RD.DEVEX.FUNCTION.070).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          version: 3.99.0@sha256:39ee0643ae620664287bcc95f133f3fc8484590d6ca4e7105d96b90dac4b9f6f # 3.99.0
          extra_args: --results=verified,unknown
